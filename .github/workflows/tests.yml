name: Workbench checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s test/test-scripts -p 'test_*.py' -q
      - run: node --test test/test-scripts/test_project_folder.cjs test/test-scripts/test_source_navigation.cjs
      - run: gunicorn --check-config --config gunicorn.conf.py app:app
