<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>$TITLE · Project Revival</title>
  <style>$CSS</style>
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">PROJECT REVIVAL / SAVED ANALYSIS</p>
    <h1>$TITLE</h1>
    <p class="intro">Read the explanation. Follow a reference. See the source for yourself.</p>
  </header>
  <main class="review-layout">
    <article class="report panel" aria-label="Gemma’s project analysis">
      <aside class="goal"><span class="eyebrow">RESTART GOAL</span><p>$GOAL</p></aside>
      $REPORT
    </article>
    <aside class="evidence panel" aria-label="Source evidence">
      <div class="evidence-heading">
        <span class="eyebrow">PROJECT FILES</span>
        <h2>Follow the evidence</h2>
        <label for="file-picker">Source file</label>
        <select id="file-picker">$OPTIONS</select>
        <p id="source-status" role="status">Click a reference to highlight its source lines.</p>
      </div>
      <div class="source-scroll">$SOURCES</div>
    </aside>
  </main>
  <script>$SCRIPT</script>
</body>
</html>
